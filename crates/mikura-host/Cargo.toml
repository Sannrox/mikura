[package]
name = "mikura-host"
version = "0.4.0"
edition = "2021"
publish = false
description = "Single-process ingest/evaluate/load host over an in-process mikura Store."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sannrox/mikura"
readme = "../../README.md"

[dependencies]
mikura = { version = "0.4.0", path = "../.." }
mikura-ingest = { version = "0.4.0", path = "../mikura-ingest" }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "product"
harness = false
