name: Bench

# Nightly product benchmarks (docs/benchmarks.md). The stored baseline is
# the first run's results on this runner's machine class; any p50 more than
# 20% slower fails the job. A manual run with `reset_baseline` replaces it
# after an accepted change.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: Store this run's results as the new baseline
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  bench:
    name: Product benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Machine class
        id: machine
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p' | tr -c 'A-Za-z0-9' '-')
          echo "class=$(nproc)-${model}" >> "$GITHUB_OUTPUT"
      - name: Restore baseline
        id: baseline
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bench-baseline
          key: bench-baseline-${{ runner.os }}-${{ steps.machine.outputs.class }}-${{ github.run_id }}
          restore-keys: bench-baseline-${{ runner.os }}-${{ steps.machine.outputs.class }}-
      - name: Run benchmarks
        env:
          MIKURA_BENCH_SIZES: "10000,1000000"
          # cargo bench runs the binary from the crate directory, so paths are absolute.
          MIKURA_BENCH_OUT: ${{ github.workspace }}/bench-results.json
        run: |
          if [ "${{ inputs.reset_baseline }}" = "true" ]; then
            rm -rf bench-baseline
          fi
          if [ -f bench-baseline/results.json ]; then
            export MIKURA_BENCH_BASELINE="$GITHUB_WORKSPACE/bench-baseline/results.json"
          else
            echo "No stored baseline yet; this run becomes the baseline."
          fi
          cargo bench --locked -p mikura-host --bench product
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench-results.json
          if-no-files-found: ignore
      - name: Store baseline
        id: store
        if: github.ref == 'refs/heads/main' && hashFiles('bench-baseline/results.json') == ''
        run: mkdir -p bench-baseline && cp bench-results.json bench-baseline/results.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.store.outcome == 'success'
        with:
          path: bench-baseline
          key: bench-baseline-${{ runner.os }}-${{ steps.machine.outputs.class }}-${{ github.run_id }}
