[package]
name = "mikura-persist-hop-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway persisted hop sidecar. Not the mikura store."

[[bin]]
name = "mikura-persist-hop-spike"
path = "src/main.rs"

[dependencies]
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
