[workspace]
members = ["crates/mikura-ingest", "crates/mikura-host"]
resolver = "2"

[package]
name = "mikura"
# When releasing:
# - Bump the version here, in crates/mikura-ingest and crates/mikura-host,
#   and in the README.md status line.
# - Run `cargo update -w` so Cargo.lock matches.
# - Move CHANGELOG.md [Unreleased] to the new version, upgrade notes first.
# - Squash-merge the release PR, then create the "v0.x.y" git tag on it.
version = "0.4.0"
edition = "2021"
publish = false
description = "Object database: durable object log, object-set evaluate, property ACLs, and Action writeback."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Sannrox/mikura"
homepage = "https://github.com/Sannrox/mikura"
keywords = ["database", "object-store", "log"]
categories = ["database-implementations"]

[dependencies]
crc32fast = "1"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Git pin until sekai-keys is on crates.io.
sekai-keys = { git = "https://github.com/Sannrox/sekai-chisei.git", rev = "1b2e12789a2b360759a087252367cf4bc633caf0" }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

[lib]
path = "src/lib.rs"

# Dependencies build without debug info in dev and test builds: backtraces
# and debuggers keep full detail for workspace crates, and build directories
# stay a fraction of the size.
[profile.dev.package."*"]
debug = false
