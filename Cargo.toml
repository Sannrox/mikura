[package]
name = "mikura"
version = "0.1.0"
edition = "2021"
publish = false
description = "Object database: durable object log, object-set evaluate, property ACLs, and Action writeback."
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
